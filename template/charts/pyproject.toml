[project]
name = "e2b-charts"
version = "1.1.0"
description = "Package for extracting data for E2B Code Interpreter"
authors = [{ name = "e2b", email = "hello@e2b.dev" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.2.6,<3",
    "matplotlib>=3.10.3,<4",
    "pydantic>=2.9.1,<3",
]

[project.urls]
Homepage = "https://e2b.dev/"
Repository = "https://github.com/e2b-dev/e2b-code-interpreter/tree/python"
"Bug Tracker" = "https://github.com/e2b-dev/code-interpreter/issues"

[tool.uv.build-backend]
module-name = ["e2b_charts"]
module-root = ""

[build-system]
requires = ["uv_build==0.13.4"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["F401", "F403"]
