name: Build Prod Template (single cluster)

# Builds the production `code-interpreter-v1` template on ONE E2B cluster.
# Every cluster is a separate tenancy with its own team, API key and template
# registry, so a template built on one cluster does not exist on the others.
# Callers run this once per cluster, each naming that cluster's secret
# statically: a dynamic `secrets[...]` index would hand the job every
# organization and repository secret instead of just the one it asked for.

on:
  workflow_call:
    inputs:
      cluster:
        description: Cluster name, for job titles, the concurrency group and the summary.
        required: true
        type: string
      E2B_DOMAIN:
        description: E2B_DOMAIN for the cluster. Empty means the SDK default.
        required: false
        type: string
        default: ''
      skip_cache:
        description: Skip build cache
        required: false
        type: boolean
        default: false
    secrets:
      E2B_API_KEY:
        description: API key for a team on this cluster.
        required: true

permissions:
  contents: read

jobs:
  build-template:
    name: Build E2B template (${{ inputs.cluster }})
    runs-on: ubuntu-latest
    # Builds on the same cluster serialize, across the release workflow and
    # manual dispatches alike; different clusters run concurrently.
    concurrency:
      group: Release-${{ github.ref }}-${{ inputs.cluster }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the cluster API key
        env:
          CLUSTER: ${{ inputs.cluster }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::error::Missing API key secret for cluster: $CLUSTER" >&2
            exit 1
          fi

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'

      - name: Install development dependencies
        working-directory: ./template
        run: pip install -r requirements-dev.txt

      - name: Build E2B template
        working-directory: ./template
        run: python build_prod.py
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_DOMAIN: ${{ inputs.E2B_DOMAIN }}
          SKIP_CACHE: ${{ inputs.skip_cache }}

      - name: Summarize
        env:
          CLUSTER: ${{ inputs.cluster }}
          E2B_DOMAIN: ${{ inputs.E2B_DOMAIN }}
        run: |
          {
            echo "### Build target"
            echo
            echo "Cluster: $CLUSTER"
            echo "Domain: ${E2B_DOMAIN:-(default)}"
          } >> "$GITHUB_STEP_SUMMARY"
